[project]
name = "torchmcubes"
description = "torchmcubes: Marching Cubes for PyTorch"
readme = "README.md"
authors = [{ name = "Tatsuya Yatagawa", email = "tatsy.mail@gmail.com" }]
license = "MPL-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  'Programming Language :: Python :: 3.9',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
]
requires-python = ">=3.9"
dynamic = ["version", "dependencies"]

[dependency-groups]
dev = [
  "torch==2.6.0",
  "scikit-build-core>=1.0",
  "pybind11>=2.10",
  "ruff>=0.17.1",
  "ty>=0.0.89",
  "numpy>=2.0.2",
  "matplotlib>=3.9.4",
]

[tool.uv]
no-build-isolation = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "torchmcubes/__init__.py"

[[tool.dynamic-metadata]]
provider = { path = ".", module = "_torch_dep:Provider" }

[tool.scikit-build]
build-dir = "build"
minimum-version = "1.0"
experimental = true
ninja.make-fallback = true
logging.level = "INFO"
build.verbose = true
messages.after-success = "SUCCESS!!"
messages.after-failure = "FAILURE!!"

[tool.scikit-build.cmake]
version = ">=3.24"
source-dir = "."
args = []

[tool.scikit-build.wheel]
exclude = ["**/.mypy_cache/**", "**/build/**", "**/.vscode/**"]

[build-system]
requires = ["scikit-build-core>=1.0", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM"]
ignore = ["N806", "N812", "SIM108"]
fixable = ["ALL"]
unfixable = ["F401", "F841"]

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2
split-on-trailing-comma = true

[tool.ty.environment]
python = ".venv"
python-version = "3.9"

[tool.ty.terminal]
error-on-warning = false
